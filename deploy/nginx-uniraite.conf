server {
    listen 80;
    server_name __DOMINIO__;

    client_max_body_size 1m;

    # API REST -> Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Página de descarga + APK
    root /var/www/uniraite;
    index index.html;

    location = /uniraite.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="UniRaite.apk"';
    }

    # App web (PWA para iPhone): index y service worker sin caché para que se actualice
    location = /app/index.html { add_header Cache-Control "no-cache"; }
    location = /app/flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
